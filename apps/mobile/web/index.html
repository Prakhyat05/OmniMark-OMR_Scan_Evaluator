<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OmniMark — High-precision mobile OMR scanning, automated evaluation, and student analytics platform.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OmniMark">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OmniMark — Mobile OMR Scanner & Evaluator</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07090e;
      --bg-surface: #0f1420;
      --accent-indigo: #6366f1;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --phone-ratio: 393 / 852;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Ambient luxury background glow */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 80% 25%, rgba(6, 182, 212, 0.14) 0%, transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(16, 185, 129, 0.10) 0%, transparent 50%),
        #07090e;
      pointer-events: none;
    }

    /* Background subtle grid pattern */
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Main Showcase Wrapper */
    .showcase-layout {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 18px 24px 32px;
    }

    /* Top Desktop Header */
    .top-header {
      width: 100%;
      max-width: 1180px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
      font-size: 20px;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
      font-weight: 600;
    }

    .brand-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }
    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.55);
      transform: translateY(-1px);
    }

    /* CENTER PHONE STAGE */
    .phone-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      flex: 1;
      position: relative;
    }

    /* PHOTOREALISTIC IPHONE 16 PRO FRAME */
    .iphone-wrapper {
      position: relative;
      /* Responsive sizing that perfectly preserves aspect ratio and fits in view */
      height: min(840px, calc(100vh - 150px));
      width: calc(min(840px, calc(100vh - 150px)) * (393 / 852));
      max-width: 94vw;
      /* Outer titanium chassis */
      border-radius: 54px;
      background: #000000;
      padding: 11px;
      /* Multi-layer bevel & shadow */
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 0 0 3px #282a32,
        0 0 0 4px #15161b,
        0 25px 70px -10px rgba(0, 0, 0, 0.85),
        0 0 50px rgba(99, 102, 241, 0.22);
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }

    /* Hardware Buttons */
    /* Left: Action Button + Volume Buttons */
    .hw-btn-action {
      position: absolute;
      left: -6px;
      top: 105px;
      width: 4px;
      height: 26px;
      background: #373942;
      border-radius: 3px 0 0 3px;
      box-shadow: -1px 0 2px rgba(0,0,0,0.5);
    }
    .hw-btn-volup {
      position: absolute;
      left: -6px;
      top: 150px;
      width: 4px;
      height: 50px;
      background: #373942;
      border-radius: 3px 0 0 3px;
      box-shadow: -1px 0 2px rgba(0,0,0,0.5);
    }
    .hw-btn-voldown {
      position: absolute;
      left: -6px;
      top: 215px;
      width: 4px;
      height: 50px;
      background: #373942;
      border-radius: 3px 0 0 3px;
      box-shadow: -1px 0 2px rgba(0,0,0,0.5);
    }
    /* Right: Power / Siri Button */
    .hw-btn-power {
      position: absolute;
      right: -6px;
      top: 165px;
      width: 4px;
      height: 75px;
      background: #373942;
      border-radius: 0 3px 3px 0;
      box-shadow: 1px 0 2px rgba(0,0,0,0.5);
    }

    /* Inner Screen Bezel */
    .iphone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 43px;
      overflow: hidden;
      background-color: #0f172a;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 30px;
      background: #000000;
      border-radius: 20px;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .camera-lens {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #1e293b 0%, #050811 80%);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .sensor-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #090d16;
    }

    /* Home Indicator Bar */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 4px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 9999px;
      z-index: 9999;
      pointer-events: none;
      transition: background 0.2s ease;
    }

    /* Target Host Container where Flutter renders */
    #flutter_host {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      border: none;
      overflow: hidden;
      z-index: 5;
    }

    /* Loading Indicator inside the Phone Screen */
    .phone-loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0a0e17;
      z-index: 50;
      padding: 24px;
      text-align: center;
    }

    .loader-spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .loader-desc {
      font-size: 0.8rem;
      color: #94a3b8;
      max-width: 220px;
      line-height: 1.4;
    }

    /* User Interaction Hint under the phone */
    .interaction-hint {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.825rem;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      border-radius: 9999px;
      backdrop-filter: blur(8px);
    }

    /* MOBILE DEVICE VIEW (Full screen on actual smartphones) */
    @media (max-width: 500px) {
      .showcase-layout {
        padding: 0;
        margin: 0;
        min-height: 100vh;
        width: 100vw;
      }
      .top-header, .interaction-hint, .hw-btn-action, .hw-btn-volup, .hw-btn-voldown, .hw-btn-power {
        display: none !important;
      }
      .iphone-wrapper {
        width: 100vw !important;
        height: 100vh !important;
        max-width: 100vw !important;
        border-radius: 0 !important;
        padding: 0 !important;
        border: none !important;
        box-shadow: none !important;
        background: transparent !important;
      }
      .iphone-screen {
        border-radius: 0 !important;
      }
      .dynamic-island, .home-indicator {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient background lighting -->
  <div class="ambient-bg"></div>
  <div class="bg-grid"></div>

  <!-- Showcase Main Layout -->
  <div class="showcase-layout">
    
    <!-- Top Header -->
    <header class="top-header">
      <div class="brand-group">
        <div class="brand-icon">🎯</div>
        <div>
          <div class="brand-title">
            OmniMark OMR
            <span class="brand-badge">v1.0.0</span>
          </div>
          <div class="brand-sub">Real-Time On-Device Flutter Mobile App Preview</div>
        </div>
      </div>

      <div class="header-actions">
        <a href="https://github.com/Prakhyat05/OmniMark-OMR_Scan_Evaluator" target="_blank" rel="noopener noreferrer" class="btn-link btn-outline">
          ⭐ GitHub Repository
        </a>
        <a href="https://github.com/Prakhyat05/OmniMark-OMR_Scan_Evaluator/releases/download/v1.0.0/omnimark-mobile-v1.0.0-arm64-v8a.apk" class="btn-link btn-primary">
          📱 Download APK (8.9 MB)
        </a>
      </div>
    </header>

    <!-- Center Phone Stage -->
    <main class="phone-stage">
      
      <!-- iPhone 16 Pro Mockup Chassis -->
      <div class="iphone-wrapper">
        
        <!-- Hardware buttons -->
        <div class="hw-btn-action"></div>
        <div class="hw-btn-volup"></div>
        <div class="hw-btn-voldown"></div>
        <div class="hw-btn-power"></div>

        <!-- Phone Screen Bezel -->
        <div class="iphone-screen">
          
          <!-- Dynamic Island -->
          <div class="dynamic-island">
            <div class="camera-lens"></div>
            <div class="sensor-dot"></div>
          </div>

          <!-- Flutter Application Host -->
          <div id="flutter_host"></div>

          <!-- Loading state inside phone screen -->
          <div class="phone-loader" id="loading-indicator">
            <div class="loader-spinner"></div>
            <div class="loader-title">OmniMark Mobile</div>
            <div class="loader-desc">Booting on-device computer vision engine & SQLite...</div>
          </div>

          <!-- iOS Home Indicator bar -->
          <div class="home-indicator"></div>
        </div>
      </div>

      <!-- Helper tip for desktop users -->
      <div class="interaction-hint">
        <span>✨</span>
        <span>Interact with the phone above — tap, scroll, and test all exam & grading features.</span>
      </div>
    </main>

  </div>

  <!-- Flutter bootstrap & custom host mounting -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
