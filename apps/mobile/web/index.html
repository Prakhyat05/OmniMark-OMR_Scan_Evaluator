<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OmniMark — High-precision mobile OMR scanning, automated evaluation, and student analytics platform.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OmniMark">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OmniMark — Mobile OMR Scanner & Evaluator</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07090e;
      --bg-surface: #0f1420;
      --accent-indigo: #6366f1;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --phone-ratio: 430 / 932;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Entire window locked to 100vh with zero scrolling */
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden; /* ABSOLUTELY ZERO PAGE SCROLLING */
    }

    /* Ambient luxury background glow */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 80% 25%, rgba(6, 182, 212, 0.14) 0%, transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(16, 185, 129, 0.10) 0%, transparent 50%),
        #07090e;
      pointer-events: none;
    }

    /* Background subtle grid pattern */
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Main Showcase Wrapper - Strict Flex Column */
    .showcase-layout {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 20px 14px;
      overflow: hidden;
    }

    /* Top Desktop Header - Compact single-line */
    .top-header {
      width: 100%;
      max-width: 1120px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      gap: 12px;
      flex-shrink: 0;
      height: 48px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.4);
      font-size: 17px;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.2;
    }

    .brand-badge {
      font-size: 0.725rem;
      padding: 2px 7px;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
      font-weight: 600;
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.2;
    }

    /* Center pill hint in header */
    .header-center-hint {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.25);
      padding: 4px 12px;
      border-radius: 9999px;
      backdrop-filter: blur(8px);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.825rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 3px 12px rgba(99, 102, 241, 0.35);
    }
    .btn-primary:hover {
      box-shadow: 0 5px 18px rgba(99, 102, 241, 0.55);
      transform: translateY(-1px);
    }

    /* CENTER PHONE STAGE - Fills exactly 100% of remaining vertical space */
    .phone-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      flex: 1;
      min-height: 0; /* Prevents overflow in flexbox */
      position: relative;
      overflow: hidden;
    }

    /* PHOTOREALISTIC IPHONE 16 PRO MAX FRAME - Perfectly fitted to viewport */
    .iphone-wrapper {
      position: relative;
      /* Height strictly bounded to remaining vertical space, width derived via aspect-ratio */
      height: 100%;
      max-height: calc(100vh - 78px);
      max-height: calc(100dvh - 78px);
      aspect-ratio: 430 / 932;
      width: auto;
      max-width: 94vw;
      /* Outer titanium chassis */
      border-radius: min(54px, 5.8vh);
      background: #000000;
      padding: min(11px, 1.2vh);
      /* Multi-layer bevel & shadow */
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.15),
        0 0 0 3px #2a2c35,
        0 0 0 4.5px #15161c,
        0 20px 60px -10px rgba(0, 0, 0, 0.9),
        0 0 45px rgba(99, 102, 241, 0.22);
      display: flex;
      flex-direction: column;
      flex-shrink: 1;
      transition: all 0.2s ease;
    }

    /* Hardware Buttons - Proportional positioning */
    .hw-btn-action {
      position: absolute;
      left: -6px;
      top: 12%;
      width: 4px;
      height: 3.2%;
      background: #373942;
      border-radius: 3px 0 0 3px;
      box-shadow: -1px 0 2px rgba(0,0,0,0.5);
    }
    .hw-btn-volup {
      position: absolute;
      left: -6px;
      top: 17.5%;
      width: 4px;
      height: 6%;
      background: #373942;
      border-radius: 3px 0 0 3px;
      box-shadow: -1px 0 2px rgba(0,0,0,0.5);
    }
    .hw-btn-voldown {
      position: absolute;
      left: -6px;
      top: 25%;
      width: 4px;
      height: 6%;
      background: #373942;
      border-radius: 3px 0 0 3px;
      box-shadow: -1px 0 2px rgba(0,0,0,0.5);
    }
    .hw-btn-power {
      position: absolute;
      right: -6px;
      top: 19%;
      width: 4px;
      height: 9%;
      background: #373942;
      border-radius: 0 3px 3px 0;
      box-shadow: 1px 0 2px rgba(0,0,0,0.5);
    }

    /* Inner Screen Bezel */
    .iphone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: min(43px, 4.8vh);
      overflow: hidden;
      background-color: #0f172a;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: min(8px, 1vh);
      left: 50%;
      transform: translateX(-50%);
      width: min(104px, 25%);
      height: min(26px, 3vh);
      background: #000000;
      border-radius: 20px;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 min(10px, 1vw);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .camera-lens {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #1e293b 0%, #050811 80%);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .sensor-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #090d16;
    }

    /* Home Indicator Bar */
    .home-indicator {
      position: absolute;
      bottom: min(7px, 0.9vh);
      left: 50%;
      transform: translateX(-50%);
      width: min(125px, 32%);
      height: 4px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 9999px;
      z-index: 9999;
      pointer-events: none;
    }

    /* Target Host Container where Flutter renders */
    #flutter_host {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      border: none;
      overflow: hidden;
      z-index: 5;
    }

    /* Loading Indicator inside the Phone Screen */
    .phone-loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0a0e17;
      z-index: 50;
      padding: 24px;
      text-align: center;
    }

    .loader-spinner {
      width: 40px;
      height: 40px;
      border: 3.5px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      margin-bottom: 14px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .loader-desc {
      font-size: 0.775rem;
      color: #94a3b8;
      max-width: 200px;
      line-height: 1.4;
    }

    /* MOBILE DEVICE VIEW (Edge-to-edge native full-screen on actual smartphones) */
    @media (max-width: 500px) {
      .showcase-layout {
        padding: 0;
        margin: 0;
        height: 100vh;
        width: 100vw;
      }
      .top-header, .header-center-hint, .hw-btn-action, .hw-btn-volup, .hw-btn-voldown, .hw-btn-power {
        display: none !important;
      }
      .iphone-wrapper {
        width: 100vw !important;
        height: 100vh !important;
        max-width: 100vw !important;
        max-height: 100vh !important;
        border-radius: 0 !important;
        padding: 0 !important;
        border: none !important;
        box-shadow: none !important;
        background: transparent !important;
        aspect-ratio: unset !important;
      }
      .iphone-screen {
        border-radius: 0 !important;
      }
      .dynamic-island, .home-indicator {
        display: none !important;
      }
    }

    @media (max-width: 780px) {
      .header-center-hint {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient background lighting -->
  <div class="ambient-bg"></div>
  <div class="bg-grid"></div>

  <!-- Showcase Main Layout -->
  <div class="showcase-layout">
    
    <!-- Top Compact Header -->
    <header class="top-header">
      <div class="brand-group">
        <div class="brand-icon">🎯</div>
        <div>
          <div class="brand-title">
            OmniMark
            <span class="brand-badge">v1.0.0</span>
          </div>
          <div class="brand-sub">iPhone 16 Pro Max • Live Flutter Engine</div>
        </div>
      </div>

      <div class="header-center-hint">
        <span>✨</span>
        <span>Tap and scroll on the phone to test</span>
      </div>

      <div class="header-actions">
        <a href="https://github.com/Prakhyat05/OmniMark-OMR_Scan_Evaluator" target="_blank" rel="noopener noreferrer" class="btn-link btn-outline">
          ⭐ GitHub
        </a>
        <a href="https://github.com/Prakhyat05/OmniMark-OMR_Scan_Evaluator/releases/download/v1.0.0/omnimark-mobile-v1.0.0-arm64-v8a.apk" class="btn-link btn-primary">
          📱 APK (8.9 MB)
        </a>
      </div>
    </header>

    <!-- Center Phone Stage -->
    <main class="phone-stage">
      
      <!-- iPhone 16 Pro Max Chassis -->
      <div class="iphone-wrapper">
        
        <!-- Hardware buttons -->
        <div class="hw-btn-action"></div>
        <div class="hw-btn-volup"></div>
        <div class="hw-btn-voldown"></div>
        <div class="hw-btn-power"></div>

        <!-- Phone Screen Bezel -->
        <div class="iphone-screen">
          
          <!-- Dynamic Island -->
          <div class="dynamic-island">
            <div class="camera-lens"></div>
            <div class="sensor-dot"></div>
          </div>

          <!-- Flutter Application Host -->
          <div id="flutter_host"></div>

          <!-- Loading state inside phone screen -->
          <div class="phone-loader" id="loading-indicator">
            <div class="loader-spinner"></div>
            <div class="loader-title">OmniMark Mobile</div>
            <div class="loader-desc">Booting on-device computer vision engine & SQLite...</div>
          </div>

          <!-- iOS Home Indicator bar -->
          <div class="home-indicator"></div>
        </div>
      </div>

    </main>

  </div>

  <!-- Flutter bootstrap & custom host mounting -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
