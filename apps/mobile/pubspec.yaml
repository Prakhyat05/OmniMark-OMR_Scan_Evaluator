name: omr_mobile_app
description: "High-precision mobile OMR scanning, automated evaluation, and parent report emailing application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^13.2.0

  # Supabase Client
  supabase_flutter: ^2.3.4

  # Fonts & Icons
  google_fonts: ^6.2.1

  # Utilities & Networking
  http: ^1.2.1
  intl: ^0.19.0
  file_picker: ^8.0.3
  image_picker: ^1.1.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3
  path: ^1.9.0
  sqflite: ^2.3.3+1
  image: ^4.2.0
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0
  pdf: ^3.11.3
  printing: ^5.14.3
  share_plus: ^10.1.4
  permission_handler: ^11.3.1
  camera: ^0.10.5+9
  camera_android: 0.10.9+6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.11
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
