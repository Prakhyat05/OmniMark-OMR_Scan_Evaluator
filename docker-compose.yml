version: '3.8'

services:
  omr-engine:
    build:
      context: ./services/omr-engine
      dockerfile: Dockerfile
    container_name: omr-engine-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
      - OMR_SERVICE_API_KEY=${OMR_SERVICE_API_KEY:-local-omr-secret-key-32chars-min}
    volumes:
      - ./services/omr-engine/app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
