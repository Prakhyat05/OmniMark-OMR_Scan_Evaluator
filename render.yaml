services:
  - type: web
    name: omnimark-omr-engine
    runtime: python
    rootDir: services/omr-engine
    buildCommand: pip install -U pip setuptools && pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
