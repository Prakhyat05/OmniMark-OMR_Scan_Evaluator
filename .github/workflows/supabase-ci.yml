name: Supabase CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'supabase/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'supabase/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local instance
        run: supabase start

      - name: Verify DB migrations
        run: supabase db lint
