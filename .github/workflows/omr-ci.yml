name: OMR Engine CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/omr-engine/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'services/omr-engine/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/omr-engine
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .[dev]

      - name: Run Pytest
        run: pytest tests/ -v
